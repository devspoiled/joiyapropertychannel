{% load i18n %}

<a href="{% url 'dashboard' %}" class="flex items-center justify-center grow">
    {% if site_logo.light and site_logo.dark %}
        <img src="{{ site_logo.dark }}" alt="{% trans 'Dashboard' %}" class="h-11 hidden dark:block"/>

        <img src="{{ site_logo.light }}" alt="{% trans 'Dashboard' %}" class="h-11 block dark:hidden" />
    {% else %}
        <img src="{{ site_logo }}" class="h-11" alt="{% trans 'Dashboard' %}" />
    {% endif %}
</a>
