{% load i18n %}
<script>
  if (typeof window.addressMapPicker === "undefined") {
    function loadMapLibre() {
      // v6+ only ships an ES module build (no classic global script bundle),
      // so this loads via dynamic import() instead of a <script src> tag.
      return new Promise((resolve) => {
        if (window.maplibregl) return resolve();
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = "https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.css";
        document.head.appendChild(link);
        import("https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.mjs").then((mod) => {
          window.maplibregl = mod;
          resolve();
        });
      });
    }

    window.addressMapPicker = function () {
      return {
        open: false,
        map: null,
        marker: null,
        searchQuery: "",
        searchResults: [],
        selectedAddress: "",
        selectedLat: null,
        selectedLng: null,
        error: "",

        async openModal() {
          this.open = true;
          this.error = "";
          await loadMapLibre();
          await this.$nextTick();
          if (!this.map) {
            this.initMap();
          } else {
            this.map.resize();
          }
          const latEl = document.getElementById("id_latitude");
          const lngEl = document.getElementById("id_longitude");
          const lat = parseFloat(latEl ? latEl.value : "");
          const lng = parseFloat(lngEl ? lngEl.value : "");
          if (!isNaN(lat) && !isNaN(lng)) {
            this.setMarker(lat, lng, false);
            this.map.flyTo({ center: [lng, lat], zoom: 14 });
          }
        },

        initMap() {
          this.map = new maplibregl.Map({
            container: this.$refs.mapContainer,
            style: {
              version: 8,
              sources: {
                osm: {
                  type: "raster",
                  tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
                  tileSize: 256,
                  attribution: "© OpenStreetMap contributors"
                }
              },
              layers: [{ id: "osm", type: "raster", source: "osm" }]
            },
            // Lahore — matches this platform's market.
            center: [74.3587, 31.5204],
            zoom: 11
          });
          this.map.addControl(new maplibregl.NavigationControl());
          this.map.on("click", (e) => this.setMarker(e.lngLat.lat, e.lngLat.lng, true));
        },

        setMarker(lat, lng, reverseGeocode) {
          this.selectedLat = lat;
          this.selectedLng = lng;
          if (this.marker) {
            this.marker.setLngLat([lng, lat]);
          } else {
            this.marker = new maplibregl.Marker({ color: "#2F6B3A", draggable: true })
              .setLngLat([lng, lat])
              .addTo(this.map);
            this.marker.on("dragend", () => {
              const pos = this.marker.getLngLat();
              this.selectedLat = pos.lat;
              this.selectedLng = pos.lng;
              this.reverseGeocode(pos.lat, pos.lng);
            });
          }
          if (reverseGeocode) this.reverseGeocode(lat, lng);
        },

        async search() {
          if (!this.searchQuery.trim()) return;
          this.error = "";
          this.searchResults = [];
          try {
            const res = await fetch(
              "https://nominatim.openstreetmap.org/search?format=json&limit=5&q=" +
                encodeURIComponent(this.searchQuery)
            );
            this.searchResults = await res.json();
            if (this.searchResults.length === 0) this.error = "{% translate 'No results found.' %}";
          } catch (e) {
            this.error = "{% translate 'Search failed — try again.' %}";
          }
        },

        chooseResult(result) {
          const lat = parseFloat(result.lat);
          const lng = parseFloat(result.lon);
          this.map.flyTo({ center: [lng, lat], zoom: 15 });
          this.setMarker(lat, lng, false);
          this.selectedAddress = result.display_name;
          this.searchResults = [];
          this.searchQuery = "";
        },

        async reverseGeocode(lat, lng) {
          try {
            const res = await fetch(
              "https://nominatim.openstreetmap.org/reverse?format=json&lat=" + lat + "&lon=" + lng
            );
            const data = await res.json();
            this.selectedAddress = data.display_name || "";
          } catch (e) {
            this.selectedAddress = "";
          }
        },

        applySelection() {
          if (this.selectedLat == null || this.selectedLng == null) {
            this.error = "{% translate 'Click the map to drop a pin first.' %}";
            return;
          }
          const addressEl = document.getElementById("id_address");
          if (this.selectedAddress) addressEl.value = this.selectedAddress;
          document.getElementById("id_latitude").value = this.selectedLat.toFixed(6);
          document.getElementById("id_longitude").value = this.selectedLng.toFixed(6);
          this.open = false;
        }
      };
    };
  }
  // This widget's fully-custom template means Unfold doesn't style this
  // field's <label> the way it does standard widgets (stray colon, no
  // bold/spacing) — force it to match the rest of the form directly
  // rather than fighting Unfold's internal field-rendering logic.
  (function () {
    var label = document.querySelector('label[for="id_address"]');
    if (!label) return;
    label.className =
      "block font-semibold mb-2 text-font-important-light text-sm dark:text-font-important-dark";
    label.innerHTML = "{% translate 'Address' %} <span class=\"text-red-600\">*</span>";
  })();
</script>

<div x-data="addressMapPicker()" class="flex w-full max-w-2xl items-center gap-2">
  <div class="min-w-0 flex-grow">{% include "django/forms/widgets/text.html" %}</div>

  <button type="button" @click="openModal()"
    class="flex h-9.5 shrink-0 items-center gap-1.5 whitespace-nowrap rounded-md border border-gray-200 bg-white px-3 text-xs font-semibold text-gray-600 hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-300">
    <svg viewBox="0 0 20 20" class="h-2.5 w-2.5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10 18s6-5.5 6-10a6 6 0 1 0-12 0c0 4.5 6 10 6 10Z" />
      <circle cx="10" cy="8" r="2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    {% translate "Choose on map" %}
  </button>

  <div x-show="open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
    @click.self="open = false">
    <div class="flex w-full max-w-2xl flex-col rounded-lg bg-white shadow-xl dark:bg-gray-900" style="max-height: 90vh;">
      <div class="flex items-center justify-between border-b border-gray-200 px-4 py-3 dark:border-gray-700">
        <span class="text-sm font-semibold text-gray-700 dark:text-gray-200">{% translate "Choose location on map" %}</span>
        <button type="button" @click="open = false" class="text-xl leading-none text-gray-400 hover:text-gray-600">&times;</button>
      </div>

      <div class="border-b border-gray-200 p-3 dark:border-gray-700">
        <div class="flex gap-2">
          <input type="text" x-model="searchQuery" @keydown.enter.prevent="search()"
            placeholder="{% translate 'Search a place, e.g. Lahore, Central Park...' %}"
            class="h-9 flex-grow rounded border border-gray-300 px-3 text-sm dark:border-gray-600 dark:bg-gray-800">
          <button type="button" @click="search()"
            class="h-9 shrink-0 rounded bg-primary-600 px-3 text-xs font-semibold text-white hover:bg-primary-700">
            {% translate "Search" %}
          </button>
        </div>
        <p x-show="error" x-cloak x-text="error" class="mt-1.5 text-xs text-red-600"></p>
        <div x-show="searchResults.length > 0" x-cloak
          class="mt-2 max-h-32 overflow-y-auto rounded border border-gray-200 dark:border-gray-700">
          <template x-for="result in searchResults" :key="result.place_id">
            <button type="button" @click="chooseResult(result)"
              class="block w-full border-b border-gray-100 px-3 py-2 text-left text-xs last:border-0 hover:bg-gray-50 dark:border-gray-800 dark:hover:bg-gray-800"
              x-text="result.display_name"></button>
          </template>
        </div>
      </div>

      <div x-ref="mapContainer" style="height: 360px;"></div>

      <div class="flex items-center justify-between gap-3 border-t border-gray-200 px-4 py-3 dark:border-gray-700">
        <span class="min-w-0 flex-1 truncate text-xs text-gray-500 dark:text-gray-400"
          x-text="selectedAddress || '{% translate 'Click the map to drop a pin' %}'"></span>
        <div class="flex shrink-0 gap-2">
          <button type="button" @click="open = false"
            class="h-8 rounded border border-gray-300 px-3 text-xs font-semibold text-gray-600 dark:border-gray-600 dark:text-gray-300">
            {% translate "Cancel" %}
          </button>
          <button type="button" @click="applySelection()"
            class="h-8 rounded bg-primary-600 px-3 text-xs font-semibold text-white hover:bg-primary-700">
            {% translate "Use this location" %}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
