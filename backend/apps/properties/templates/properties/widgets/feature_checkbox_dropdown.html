{% load i18n %}
<script>
  if (typeof window.featureDropdown === "undefined") {
    window.featureDropdown = function (groups, categories, quickAddUrl) {
      return {
        open: false,
        adding: false,
        newName: "",
        newCategory: categories[0] ? categories[0].value : "",
        error: "",
        groups: groups,
        categories: categories,
        get selectedCount() {
          return this.groups.reduce(
            (total, group) => total + group.options.filter((o) => o.selected).length,
            0
          );
        },
        toggleAdding() {
          this.adding = !this.adding;
          this.error = "";
        },
        csrfToken() {
          return this.$root.closest("form").querySelector("[name=csrfmiddlewaretoken]").value;
        },
        async createFeature() {
          const name = this.newName.trim();
          if (!name) {
            this.error = "{% translate 'Enter a feature name.' %}";
            return;
          }
          const body = new URLSearchParams({ name: name, category: this.newCategory });
          const response = await fetch(quickAddUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
              "X-CSRFToken": this.csrfToken()
            },
            body: body
          });
          if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            this.error = data.detail || "{% translate 'Something went wrong.' %}";
            return;
          }
          const feature = await response.json();
          const group = this.groups.find((g) => g.value === feature.category);
          if (group && !group.options.some((o) => o.value === feature.id)) {
            group.options.push({ value: feature.id, label: feature.name, selected: true });
          }
          this.newName = "";
          this.adding = false;
          this.error = "";
        }
      };
    };
  }
</script>

<script id="feature-dropdown-groups-{{ widget.name }}" type="application/json">{{ widget.groups_json|safe }}</script>
<script id="feature-dropdown-categories-{{ widget.name }}" type="application/json">{{ widget.categories_json|safe }}</script>

<div
  x-data="featureDropdown(
    JSON.parse(document.getElementById('feature-dropdown-groups-{{ widget.name }}').textContent),
    JSON.parse(document.getElementById('feature-dropdown-categories-{{ widget.name }}').textContent),
    '{{ widget.quick_add_url|escapejs }}'
  )"
  class="relative w-full max-w-2xl" @click.outside="open = false">
  <button type="button" @click="open = !open"
    class="flex h-9.5 w-full items-center justify-between rounded-md border border-gray-200 bg-white px-3 text-sm text-gray-600 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-300">
    <span x-text="selectedCount + ' ' + (selectedCount === 1 ? '{% translate "feature selected" %}' : '{% translate "features selected" %}')"></span>
    <svg viewBox="0 0 20 20" class="h-4 w-4 shrink-0 transition-transform" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" stroke-width="1.8">
      <path stroke-linecap="round" stroke-linejoin="round" d="m5 7.5 5 5 5-5" />
    </svg>
  </button>

  <div x-show="open" x-cloak
    class="absolute z-30 mt-1 w-full rounded-md border border-gray-200 bg-white shadow-lg dark:border-gray-700 dark:bg-gray-900">
    <div class="flex items-center justify-between border-b border-gray-200 px-3 py-2 dark:border-gray-700">
      <span class="text-[11px] font-semibold uppercase tracking-wide text-gray-400 dark:text-gray-500">
        {% translate "Select features" %}
      </span>
      <button type="button" @click="toggleAdding()"
        class="text-xs font-semibold text-primary-600 hover:underline dark:text-primary-500">
        <span x-text="adding ? '{% translate "Cancel" %}' : '+ {% translate "Add new" %}'"></span>
      </button>
    </div>

    <div x-show="adding" x-cloak class="border-b border-gray-200 p-3 dark:border-gray-700">
      <input type="text" x-model="newName" placeholder="{% translate 'Feature name' %}"
        class="mb-2 h-8 w-full rounded border border-gray-300 px-2 text-sm dark:border-gray-600 dark:bg-gray-800">
      <select x-model="newCategory" class="mb-2 h-8 w-full rounded border border-gray-300 px-2 text-sm dark:border-gray-600 dark:bg-gray-800">
        <template x-for="cat in categories" :key="cat.value">
          <option :value="cat.value" x-text="cat.label"></option>
        </template>
      </select>
      <p x-show="error" x-text="error" class="mb-2 text-xs text-red-600"></p>
      <button type="button" @click="createFeature()"
        class="h-8 w-full rounded bg-primary-600 text-xs font-semibold text-white hover:bg-primary-700">
        {% translate "Add" %}
      </button>
    </div>

    <div x-show="!adding" x-cloak class="max-h-72 overflow-y-auto p-3">
      <template x-for="group in groups" :key="group.value">
        <div x-show="group.options.length > 0" class="mb-3 last:mb-0">
          <div class="mb-1.5 text-[11px] font-semibold uppercase tracking-wide text-gray-400 dark:text-gray-500" x-text="group.label"></div>
          <template x-for="option in group.options" :key="option.value">
            <label class="flex items-center gap-2 py-1 text-sm text-gray-700 dark:text-gray-200">
              <input type="checkbox" name="{{ widget.name }}" :value="option.value" x-model="option.selected"
                class="h-4 w-4 rounded border-gray-300 text-primary-600 focus:ring-primary-500 dark:border-gray-600">
              <span x-text="option.label"></span>
            </label>
          </template>
        </div>
      </template>
    </div>
  </div>
</div>
