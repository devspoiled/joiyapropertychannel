services:
  db:
    image: postgres:17-bookworm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-db}"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: backend
      dockerfile: Dockerfile.prod
    expose:
      - "8001"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: frontend
      dockerfile: Dockerfile.prod
    expose:
      - "3000"
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
